name: YapCode cloud verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'chat/yapcode-*.js'
      - 'chat/yap-media-policy.js'
      - 'scripts/yapcode-task-runner.cjs'
      - 'tests/yap-media-policy.cjs'
      - '.github/workflows/yapcode-cloud-verify.yml'

permissions:
  contents: read

concurrency:
  group: yapcode-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check chat/yap-media-policy.js
          node --check chat/yapcode-cloud-tasks.js
          node --check scripts/yapcode-task-runner.cjs
      - name: Regression tests
        run: node --test tests/yap-media-policy.cjs
      - name: Task runner verification
        shell: bash
        run: |
          id=$(node scripts/yapcode-task-runner.cjs new "Check the YapCode cloud runner" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          node scripts/yapcode-task-runner.cjs verify "$id"
