name: YapCode cloud verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'chat/yapcode-*.js'
      - 'chat/yapcoding-autonomous.js'
      - 'supabase/functions/yapcode-execute/**'
      - 'supabase/functions/yap-stripe-checkout/**'
      - 'supabase/migrations/*bounded_yapcoding*.sql'
      - 'tests/yapcode-bounded-executor.mjs'
      - 'chat/yap-work-reset.js'
      - 'chat/yap-media-policy.js'
      - 'scripts/yapcode-task-runner.cjs'
      - 'tests/yap-media-policy.cjs'
      - 'tests/yapcode-usage-policy.cjs'
      - 'tests/yap-work-reset.cjs'
      - 'tests/yapcode-queue-guard.cjs'
      - 'supabase/migrations/20261102_yapcode_queue_guard.sql'
      - '.github/workflows/yapcode-cloud-verify.yml'

permissions:
  contents: read

concurrency:
  group: yapcode-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check chat/yap-media-policy.js
          node --check chat/yapcode-cloud-tasks.js
          node --check chat/yapcode-usage-policy.js
          node --check chat/yapcode-usage-ui.js
          node --check chat/yap-work-reset.js
          node --check scripts/yapcode-task-runner.cjs
          node --check chat/yapcoding-autonomous.js
          node --check supabase/functions/yapcode-execute/executor.mjs
          node --check supabase/functions/yapcode-execute/handler.mjs
      - name: Regression tests
        run: node --test tests/yapcode-bounded-executor.mjs tests/yap-media-policy.cjs tests/yapcode-usage-policy.cjs tests/yap-work-reset.cjs tests/yapcode-queue-guard.cjs
      - name: Task runner verification
        shell: bash
        run: |
          id=$(node scripts/yapcode-task-runner.cjs new "Check the YapCode cloud runner" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          node scripts/yapcode-task-runner.cjs verify "$id"
