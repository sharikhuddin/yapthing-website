<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YapPlugins · YapThing</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#1d2c20;background:#f8faf5}*{box-sizing:border-box}body{margin:0}header{padding:20px max(20px,calc((100vw - 1050px)/2));background:#fff;border-bottom:1px solid #e3e9de;display:flex;justify-content:space-between;align-items:center}a{color:#295d3b;text-decoration:none}header strong{font-size:22px}main{max-width:1050px;margin:auto;padding:28px 20px 70px}h1{font-size:clamp(28px,4vw,40px);margin-bottom:6px}p{color:#657268}input{width:100%;padding:15px 18px;border-radius:15px;border:1px solid #cfd9c9;font:inherit;background:#fff;margin:15px 0}h2{font-size:18px;margin:32px 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.tile{border:1px solid #e0e8d9;border-radius:17px;background:white;padding:16px;display:flex;align-items:center;gap:13px;min-height:88px}.tile img{width:42px;height:42px;object-fit:contain;background:#f2f9e7;padding:8px;border-radius:12px}.tile b{display:block}.tile small{color:#667467;line-height:1.4}#notice{font-size:13px;background:#eff6e7;padding:12px 15px;border-radius:12px;margin-top:12px}</style></head><body><header><a href="../"><strong>yapthing</strong></a><a href="../chat/">Back to chat</a></header><main><h1>YapPlugins <span style="color:#6b9941">✦</span></h1><p>One clean place to explore the tools that can extend YapThing.</p><input id="search" type="search" placeholder="Find a plugin or category…" aria-label="Search plugins"><div id="notice">Discoverable does not mean connected. Account services require a separate YapThing authorization. ChatGPT connections do not automatically transfer.</div><div id="directory"></div></main><script>const catalog=[["Developer","GitHub","github.com","Public repo discovery; private setup"],["Developer","Desktop Commander","desktopcommander.app","Authorized computer access · setup required"],["Developer","Supabase","supabase.com","Backend projects · setup required"],["Developer","Replit","replit.com","App projects · setup required"],["Developer","Linear","linear.app","Issues and tasks · setup required"],["Productivity","Gmail","gmail.com","Email · setup required"],["Productivity","Outlook","outlook.com","Mail and calendar · setup required"],["Productivity","Google Calendar","calendar.google.com","Schedules · setup required"],["Files & Cloud","Google Drive","drive.google.com","Files · setup required"],["Files & Cloud","Google Sheets","sheets.google.com","Spreadsheets · setup required"],["Files & Cloud","Dropbox","dropbox.com","Cloud files · setup required"],["Files & Cloud","OneDrive","onedrive.live.com","Cloud files · setup required"],["Work","Slack","slack.com","Workspace messages · setup required"],["Work","Notion","notion.so","Notes · setup required"],["Work","Trello","trello.com","Boards · setup required"],["Research","Wikipedia","wikipedia.org","Public reference research"],["Research","Crossref","crossref.org","Public scholarly metadata"],["Research","Weather","open-meteo.com","Forecast API · setup required"],["Business","Shopify","shopify.com","Store operations · setup required"],["Business","LinkedIn","linkedin.com","Professional data · setup required"],["Business","Indeed Jobs","indeed.com","Job search · setup required"]];const root=document.getElementById('directory');const search=document.getElementById('search');function render(){root.replaceChildren();const q=search.value.trim().toLowerCase();for(const group of [...new Set(catalog.map(x=>x[0]))].sort()){const items=catalog.filter(x=>x[0]===group&&x.join(' ').toLowerCase().includes(q));if(!items.length)continue;const section=document.createElement('section');const h=document.createElement('h2');h.textContent=group;const grid=document.createElement('div');grid.className='grid';for(const item of items){const tile=document.createElement('article');tile.className='tile';const img=document.createElement('img');img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(item[2])+'&sz=64';img.alt='';img.loading='lazy';const copy=document.createElement('div');const title=document.createElement('b');title.textContent=item[1];const info=document.createElement('small');info.textContent=item[3];copy.append(title,info);tile.append(img,copy);grid.append(tile)}section.append(h,grid);root.append(section)}}search.addEventListener('input',render);render();</script></body></html>
