<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YapThing Plugins · Connect services</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#1d2c20;background:#f8faf5}*{box-sizing:border-box}body{margin:0}header{padding:20px max(20px,calc((100vw - 1050px)/2));background:#fff;border-bottom:1px solid #e3e9de;display:flex;justify-content:space-between;align-items:center}a{color:#295d3b;text-decoration:none}header strong{font-size:22px}main{max-width:1050px;margin:auto;padding:28px 20px 70px}h1{font-size:clamp(28px,4vw,40px);margin-bottom:6px}p{color:#657268}input{width:100%;padding:15px 18px;border-radius:15px;border:1px solid #cfd9c9;font:inherit;background:#fff;margin:15px 0}h2{font-size:18px;margin:32px 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.tile{border:1px solid #e0e8d9;border-radius:17px;background:white;padding:16px;display:flex;align-items:center;gap:13px;min-height:88px}.tile img{width:42px;height:42px;object-fit:contain;background:#f2f9e7;padding:8px;border-radius:12px}.tile b{display:block}.tile small{color:#667467;line-height:1.4}#notice{font-size:13px;background:#eff6e7;padding:12px 15px;border-radius:12px;margin-top:12px}</style></head><body><header><a href="../"><strong>yapthing</strong></a><a href="../chat/">Back to chat</a></header><main><h1>YapThing Plugins <span style="color:#6b9941">✦</span></h1><p>One clean place to explore the tools that can extend YapThing.</p><input id="search" type="search" placeholder="Find a plugin or category…" aria-label="Search plugins"><div id="notice">Connect your favorite services to YapThing. Public tools work immediately; account connections appear when their secure YapThing sign-in is available.</div><div id="directory"></div></main><script src="connections.js?v=20261028-1"></script><script>const catalog=[["Developer","GitHub","github.com","Public repo discovery; private setup"],["Developer","Desktop Commander","desktopcommander.app","Authorized computer access · connection coming soon"],["Developer","Supabase","supabase.com","Backend projects · connection coming soon"],["Developer","Replit","replit.com","App projects · connection coming soon"],["Developer","Linear","linear.app","Issues and tasks · connection coming soon"],["Productivity","Gmail","gmail.com","Email · connection coming soon"],["Productivity","Outlook","outlook.com","Mail and calendar · connection coming soon"],["Productivity","Google Calendar","calendar.google.com","Schedules · connection coming soon"],["Files & Cloud","Google Drive","drive.google.com","Files · connection coming soon"],["Files & Cloud","Google Sheets","sheets.google.com","Spreadsheets · connection coming soon"],["Files & Cloud","Dropbox","dropbox.com","Cloud files · connection coming soon"],["Files & Cloud","OneDrive","onedrive.live.com","Cloud files · connection coming soon"],["Work","Slack","slack.com","Workspace messages · connection coming soon"],["Work","Notion","notion.so","Notes · connection coming soon"],["Work","Trello","trello.com","Boards · connection coming soon"],["Research","Wikipedia","wikipedia.org","Public reference research"],["Research","Crossref","crossref.org","Public scholarly metadata"],["Research","Weather","open-meteo.com","Forecast API · connection coming soon"],["Business","Shopify","shopify.com","Store operations · connection coming soon"],["Business","LinkedIn","linkedin.com","Professional data · connection coming soon"],["Business","Indeed Jobs","indeed.com","Job search · connection coming soon"]];const root=document.getElementById('directory');
const search=document.getElementById('search');
const publicTools={'GitHub':'https://github.com/search?q=','Wikipedia':'https://en.wikipedia.org/w/index.php?search=','Crossref':'https://search.crossref.org/?q='};
const details=document.createElement('dialog');details.id='plugin-details';details.setAttribute('aria-label','Plugin details');details.style.cssText='border:1px solid #dce7d5;border-radius:20px;padding:24px;width:min(92vw,490px);box-shadow:0 18px 60px #172d2029;background:#fff;color:#1d2c20';
details.innerHTML='<form method="dialog"><button style="float:right;border:0;background:transparent;font-size:24px;cursor:pointer" aria-label="Close">×</button></form><h2 id="plugin-name"></h2><p id="plugin-description"></p><p id="plugin-access"></p><div id="plugin-actions"></div>';
document.body.append(details);
function openDetails(item){
 document.getElementById('plugin-name').textContent=item[1];
 document.getElementById('plugin-description').textContent=item[3];
 const ready=Object.prototype.hasOwnProperty.call(publicTools,item[1]);
 document.getElementById('plugin-access').textContent=ready?'Public search is available without connecting an account.':'YapThing connection is not available yet for this service. Your files and account remain private until you authorize a supported connection.';
 const actions=document.getElementById('plugin-actions');actions.replaceChildren();
 if(!ready){
  const map={'Desktop Commander':'desktop-commander','Google Drive':'google-drive','Google Sheets':'google-sheets','Google Calendar':'google-calendar','Indeed Jobs':'indeed'};
  const providerId=map[item[1]]||item[1].toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const state=document.createElement('p');state.textContent='Checking YapThing account connection…';actions.append(state);
  const control=document.createElement('button');control.type='button';control.textContent='Set up connection';control.style.cssText='border:0;border-radius:11px;padding:12px 16px;background:#dcf86d;color:#263c21;font-weight:750;cursor:pointer';actions.append(control);
  const guidance=document.createElement('div');guidance.hidden=true;guidance.style.cssText='padding:12px 14px;border:1px solid #dce7d5;border-radius:12px;margin:12px 0;background:#f7faf3;font-size:14px';
  const heading=document.createElement('strong');heading.textContent='Connect '+item[1]+' to YapThing';
  const explanation=document.createElement('p');explanation.textContent='This provider needs a secure YapThing authorization integration before it can access your account. The integration is not enabled yet. No access has been granted.';
  const signin=document.createElement('a');signin.href='../chat/';signin.textContent='Open YapThing account and chat';signin.style.cssText='display:inline-block;margin:6px 0;color:#295d3b;font-weight:650';
  const help=document.createElement('p');help.textContent='Your YapThing sign-in is separate from permission to access '+item[1]+'. When the connection is enabled, this page will show the provider authorization and permissions before connecting.';
  guidance.append(heading,explanation,signin,help);actions.append(guidance);
  const refresh=async()=>{try{const data=await window.YapPluginConnections.list();const record=data.providers.find(x=>x.id===providerId);const connected=record?.status==='connected';const available=Boolean(record?.connect_available);state.textContent='YapThing status: '+(connected?'Connected':record?.status==='expired'?'Expired':'Not connected');control.textContent=connected?'Disconnect':available?'Connect to YapThing':'Set up connection';control.disabled=false;control.onclick=async()=>{if(connected){if(!confirm('Disconnect '+item[1]+' from YapThing?'))return;control.disabled=true;try{await window.YapPluginConnections.disconnect(providerId);await refresh()}catch(err){state.textContent=err.message;control.disabled=false}return}if(available){control.disabled=true;try{await window.YapPluginConnections.connect(providerId);await refresh()}catch(err){state.textContent=err.message;guidance.hidden=false;control.disabled=false}return}guidance.hidden=!guidance.hidden};}catch(err){state.textContent=err.message;control.textContent='Connection setup details';control.disabled=false;control.onclick=()=>{guidance.hidden=!guidance.hidden}}};
  refresh();
 }

 if(ready){
  const form=document.createElement('form');form.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
  const field=document.createElement('input');field.type='search';field.placeholder='What would you like to find?';field.required=true;field.style.cssText='flex:1;min-width:170px;margin:0';
  const go=document.createElement('button');go.textContent='Search';go.type='submit';go.style.cssText='border:0;border-radius:11px;padding:12px 16px;background:#dcf86d;color:#263c21;font-weight:750;cursor:pointer';
  form.addEventListener('submit',e=>{e.preventDefault();const query=field.value.trim();if(query)window.open(publicTools[item[1]]+encodeURIComponent(query),'_blank','noopener,noreferrer')});
  form.append(field,go);actions.append(form);
 }else{
  const info=document.createElement('p');info.textContent='Connection permissions are controlled by YapThing. A provider website does not grant account access.';
  info.style.fontSize='14px';actions.append(info);
  const provider=document.createElement('a');provider.href='https://'+item[2]+'/';provider.target='_blank';provider.rel='noopener noreferrer';provider.textContent='Visit '+item[1]+' · not a YapThing connection';provider.style.cssText='display:inline-block;padding:10px 0;color:#295d3b';actions.append(provider);
 }
 details.showModal();
}
function render(){
 root.replaceChildren();const q=search.value.trim().toLowerCase();
 for(const group of [...new Set(catalog.map(x=>x[0]))].sort()){
  const items=catalog.filter(x=>x[0]===group&&x.join(' ').toLowerCase().includes(q));if(!items.length)continue;
  const section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');
  h.textContent=group;grid.className='grid';
  for(const item of items){
   const tile=document.createElement('button');tile.type='button';tile.className='tile';tile.style.cssText='width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit';
   tile.setAttribute('aria-label','View '+item[1]+' plugin details');tile.addEventListener('click',()=>openDetails(item));
   const img=document.createElement('img');img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(item[2])+'&sz=64';img.alt='';img.loading='lazy';img.onerror=()=>{img.style.display='none'};
   const copy=document.createElement('div'),title=document.createElement('b'),info=document.createElement('small');
   title.textContent=item[1];info.textContent=item[3];copy.append(title,info);tile.append(img,copy);grid.append(tile);
  }
  section.append(h,grid);root.append(section);
 }
 if(!root.children.length){const empty=document.createElement('p');empty.textContent='No plugins match your search.';root.append(empty)}
}
search.addEventListener('input',render);render();</script></body></html>
